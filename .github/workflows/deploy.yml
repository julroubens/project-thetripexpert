name: Deploy to S3

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::089674142413:role/github-deploy-thetripexpertco
          aws-region: us-east-1

      - name: Verify build output
        run: |
          test -f dist/thetripexpert/browser/index.html || {
            echo "index.html not found"
            find dist -maxdepth 4 -name index.html
            exit 1
          }

      - name: Deploy to S3
        run: |
          aws s3 sync dist/thetripexpert/browser/ \
            s3://thetripexpertco.com/ \
            --delete