name: Deploy to S3

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::089674142413:role/github-deploy-thetripexpertco
          aws-region: us-east-1

      - name: Verify build output
        run: |
          test -f dist/thetripexpert/browser/index.html || {
            echo "index.html not found"
            find dist -maxdepth 4 -name index.html
            exit 1
          }

      # Upload hashed JS/CSS first so new index.html never points at missing files.
      # index.html must not be cached — it references new chunk hashes every build.
      - name: Deploy to S3
        run: |
          aws s3 sync dist/thetripexpert/browser/ \
            s3://thetripexpertco.com/ \
            --delete \
            --exclude "index.html" \
            --cache-control "public,max-age=31536000,immutable"

          aws s3 cp dist/thetripexpert/browser/index.html \
            s3://thetripexpertco.com/index.html \
            --cache-control "no-cache,no-store,must-revalidate" \
            --content-type "text/html"

      # Without this, CloudFront keeps serving old JS that imports deleted chunks
      # (404s are rewritten to index.html → "Failed to fetch dynamically imported module").
      - name: Invalidate CloudFront
        run: |
          DIST_ID=$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?Aliases.Items!=null && contains(Aliases.Items, 'thetripexpertco.com')].Id | [0]" \
            --output text)

          if [ -z "$DIST_ID" ] || [ "$DIST_ID" = "None" ]; then
            echo "Could not find CloudFront distribution for thetripexpertco.com"
            exit 1
          fi

          echo "Invalidating distribution $DIST_ID"
          aws cloudfront create-invalidation \
            --distribution-id "$DIST_ID" \
            --paths "/*"
