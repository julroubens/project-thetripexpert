<div class="quote">
    <section class="quote-hero">
        <div class="container">
            <h1>Get Your Custom Travel Quote</h1>
            <p class="lead">
                Tell us about your dream trip and we&apos;ll build a personalized itinerary through our TravelJoy
                planning portal.
            </p>
        </div>
    </section>

    <section class="quote-embed-section">
        <div class="container">
            <div class="quote-embed-wrapper">
                <iframe
                    [src]="travelJoyUrl"
                    title="The Trip Expert - TravelJoy Quote Form"
                    loading="lazy"
                    referrerpolicy="no-referrer-when-downgrade"
                    frameborder="0">
                </iframe>
            </div>
        </div>
    </section>
</div>
